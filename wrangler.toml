name = "al2100"
main = "dist/worker.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "AL_DB"
database_name = "al2100"
database_id = "1431274d-c8d8-431b-aa1f-eaff2c466ada"

[[r2_buckets]]
binding = "AL_BUCKET"
bucket_name = "al2100"

[[kv_namespaces]]
binding = "AL_KV"
id = "87d4fd94c6114923b3ef02ae7069115c"

[[queues.producers]]
binding = "AL_QUEUE"
queue = "al2100-jobs"

[[queues.consumers]]
queue = "al2100-jobs"
max_batch_size = 10
max_batch_timeout = 5
